name: quality check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    uses: EliteMay/.github/.github/workflows/reusable-web-baseline.yml@47f58bc690cda0f3aea21c0e65af164a9d6cffdd
    with:
      node-version: '22'
      syntax-paths: '.'
      check-json: true

  static-check:
    needs: baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static project integrity
        run: node tests/static-check.mjs
