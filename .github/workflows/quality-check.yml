name: quality check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    uses: EliteMay/.github/.github/workflows/reusable-web-baseline.yml@47f58bc690cda0f3aea21c0e65af164a9d6cffdd
    with:
      node-version: '22'
      syntax-paths: '.'
      check-json: true

  project-check:
    needs: baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static project integrity
        run: node tests/static-check.mjs

      - name: Core regression tests
        run: |
          node tests/core-utils.test.mjs
          node tests/timestamp-parser.test.mjs

      - name: Browser smoke
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium binary found on runner"
            exit 1
          fi
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/asmrtube-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 0.25
          done
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom http://127.0.0.1:4173/tests/browser-smoke.html >/tmp/asmrtube-smoke.html 2>/tmp/asmrtube-chrome.log || {
            cat /tmp/asmrtube-chrome.log
            exit 1
          }
          if ! grep -q 'data-status="PASS"' /tmp/asmrtube-smoke.html; then
            cat /tmp/asmrtube-smoke.html
            cat /tmp/asmrtube-chrome.log
            exit 1
          fi
